name: Django checks
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: disposable-ci-only-fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.lock
      - run: python mysite/manage.py check
      - run: python mysite/manage.py test api
      - run: pip install ruff && ruff check mysite --select E9,F63,F7,F82
